<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StageLight</title>
<style>
 :root{color-scheme:dark}
 body{margin:0;height:100vh;display:grid;place-items:center;background:#0f1722;color:#eef3f8;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 main{text-align:center;max-width:520px;padding:24px}
 h1{font-size:22px;font-weight:600;margin:0 0 8px}
 p{color:#8fa3b8;margin:0}
 .error h1{color:#ef8b8f}
 code{color:#eef3f8;word-break:break-all}
</style>
</head>
<body>
<!-- Shown while the app starts or connects to the lighting engine; the app then loads the desk from the engine. -->
<main id="status"><h1>StageLight</h1><p>Starting the lighting engine…</p></main>
<script>
 // Called by the app (src-tauri/src/lib.rs) with plain text.
 window.setStatus=(title,detail,error)=>{const m=document.getElementById('status');m.className=error?'error':'';m.innerHTML='';const h=document.createElement('h1');h.textContent=title;const p=document.createElement('p');p.textContent=detail;m.append(h,p)};
</script>
</body>
</html>
