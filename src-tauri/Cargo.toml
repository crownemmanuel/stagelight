[package]
name = "stagelight"
version = "0.4.1"
description = "StageLight: lighting engine, operator desk and 3D stage preview"
authors = ["Salvation Productions"]
license = ""
repository = "https://github.com/crownemmanuel/stagelight"
edition = "2024"
rust-version = "1.90"

[lib]
name = "stagelight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
